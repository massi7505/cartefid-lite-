<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Hors ligne</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0D0D0D;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
         display:flex;align-items:center;justify-content:center;min-height:100vh;padding:1.5rem;text-align:center}
    .icon{font-size:3.5rem;margin-bottom:1.25rem}
    h1{font-size:1.375rem;font-weight:800;margin-bottom:.5rem}
    p{color:rgba(255,255,255,.45);font-size:.9rem;line-height:1.6;max-width:280px;margin:0 auto 1.75rem}
    button{background:#CCFF00;color:#000;border:none;border-radius:.875rem;padding:.875rem 2rem;
           font-size:.9rem;font-weight:700;cursor:pointer;transition:opacity .15s}
    button:active{opacity:.75}
  </style>
</head>
<body>
  <div>
    <div class="icon">📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Vérifiez votre connexion et réessayez.<br>Vos données sont sauvegardées.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
</body>
</html>
