<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Hors ligne</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --theme:#0D0D0D;
      --bg:#0D0D0D;
      --msg:"Vous êtes hors connexion. Reconnectez-vous pour scanner.";
    }
    body{
      background:var(--bg,#0D0D0D);
      color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;
      padding:calc(env(safe-area-inset-top) + 1.5rem) 1.5rem calc(env(safe-area-inset-bottom) + 1.5rem);
      text-align:center;
    }
    .card{max-width:320px;width:100%}
    .icon-wrap{
      width:80px;height:80px;
      border-radius:1.5rem;
      background:rgba(255,255,255,0.06);
      display:flex;align-items:center;justify-content:center;
      margin:0 auto 1.5rem;
      border:1px solid rgba(255,255,255,0.08);
    }
    .icon-wrap svg{opacity:.8}
    h1{font-size:1.375rem;font-weight:800;margin-bottom:.5rem;letter-spacing:-.01em}
    p{color:rgba(255,255,255,.45);font-size:.9rem;line-height:1.6;max-width:260px;margin:0 auto 1.75rem}
    .btn{
      display:inline-flex;align-items:center;gap:.5rem;
      background:#CCFF00;color:#000;
      border:none;border-radius:.875rem;
      padding:.875rem 2rem;
      font-size:.9rem;font-weight:700;
      cursor:pointer;transition:opacity .15s;
      text-decoration:none;
    }
    .btn:active{opacity:.75}
    .app-logo{
      width:64px;height:64px;border-radius:1rem;
      object-fit:cover;margin:0 auto 1.5rem;display:block;
    }
  </style>
</head>
<body>
  <div class="card" id="root">
    <div class="icon-wrap">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round">
        <path d="M1 6s4-4 11-4 11 4 11 4"/>
        <path d="M1 10s4-4 11-4 11 4 11 4"/>
        <line x1="4.93" y1="19" x2="12" y2="12"/>
        <line x1="19.07" y1="19" x2="12" y2="12"/>
        <line x1="12" y1="22" x2="12" y2="12"/>
      </svg>
    </div>
    <h1>Vous êtes hors ligne</h1>
    <p id="msg">Vérifiez votre connexion et réessayez.</p>
    <button class="btn" onclick="location.reload()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 .49-4.47"/>
      </svg>
      Réessayer
    </button>
  </div>

  <script>
    // Load branded config from SW cache or API
    (async function() {
      try {
        const r = await fetch('/api/sw-config', { cache: 'no-store' });
        if (!r.ok) return;
        const cfg = await r.json();
        if (cfg.offlineMessage) {
          document.getElementById('msg').textContent = cfg.offlineMessage;
        }
        if (cfg.themeColor) {
          document.documentElement.style.setProperty('--bg', cfg.themeColor);
          document.body.style.background = cfg.themeColor;
        }
        if (cfg.logoUrl) {
          const root = document.getElementById('root');
          const iconWrap = root.querySelector('.icon-wrap');
          const img = document.createElement('img');
          img.src = cfg.logoUrl;
          img.alt = cfg.appName || 'Logo';
          img.className = 'app-logo';
          root.insertBefore(img, iconWrap);
          iconWrap.style.display = 'none';
        }
      } catch(e) { /* offline, use defaults */ }
    })();
  </script>
</body>
</html>
